name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Format
        shell: bash
        run: mise exec -- zig fmt --check build.zig src examples test
      - name: Tests
        shell: bash
        run: mise exec -- zig build test --summary all
      - name: Check default package does not install the example
        shell: bash
        run: |
          mise exec -- zig build
          test ! -e zig-out/bin/git-pager
          test ! -e zig-out/bin/git-pager.exe
      - name: Check patch whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD
      - name: Install optional example
        shell: bash
        run: mise exec -- zig build example
      - name: Install ConPTY test dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.5
      - name: Test Git pager in ConPTY
        if: runner.os == 'Windows'
        run: python test/windows_conpty.py zig-out/bin/git-pager.exe
