name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Format
        shell: bash
        run: mise exec -- zig fmt --check build.zig src examples test
      - name: Tests
        shell: bash
        run: mise exec -- zig build test --summary all
      - name: Check Git fixtures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mise exec -- zig build fixtures
          git diff --exit-code -- src/fixtures
      - name: Check default package does not install the example
        shell: bash
        run: |
          mise exec -- zig build
          test ! -e zig-out/bin/git-pager
          test ! -e zig-out/bin/git-pager.exe
      - name: Check patch whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD
      - name: Install optional example
        shell: bash
        run: mise exec -- zig build example
