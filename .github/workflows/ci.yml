name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Format
        run: zig fmt --check build.zig build.zig.zon src e2e tools
      - name: Tests
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: zig build test
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          zig build test-bins -j1
          ./zig-out/bin/lantana-test.exe
          ./zig-out/bin/terminal-test.exe
          ./zig-out/bin/package-test.exe
      - name: Check Git fixtures
        if: runner.os == 'macOS'
        run: |
          zig build fixtures
          git diff --exit-code -- src/fixtures

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Build release archives and check package metadata
        run: zig build release -j2
