name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Format
        shell: bash
        run: mise exec -- zig fmt --check build.zig build.zig.zon src e2e tools
      - name: Tests
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 10
        run: mise exec -- zig build test --summary all
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 10
        run: |
          mise exec -- zig build test-bins -j1 --summary all
          ./zig-out/bin/lantana-test.exe
          ./zig-out/bin/terminal-test.exe
      - name: Check Git fixtures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mise exec -- zig build fixtures
          git diff --exit-code -- src/fixtures
      - name: Check installed command and Git integration
        shell: bash
        run: |
          mise exec -- zig build
          bash e2e/cli.sh
      - name: Check patch whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Build release archives and check package metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for entry in \
            'aarch64-macos macos-arm64 lantana' \
            'x86_64-macos macos-x64 lantana' \
            'x86_64-linux-gnu linux-x64 lantana' \
            'aarch64-linux-gnu linux-arm64 lantana' \
            'x86_64-windows windows-x64 lantana.exe' \
            'aarch64-windows windows-arm64 lantana.exe'; do
            read -r target asset binary <<< "$entry"
            zig build "-Dtarget=$target" -Doptimize=ReleaseSafe
            zip -q -j "dist/lantana-$asset.zip" "zig-out/bin/$binary"
          done
          bash pkg/render_test.sh dist
