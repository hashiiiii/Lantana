name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z, no v prefix)'
        required: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Validate input
        uses: actions/github-script@v9
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Run this workflow from main');
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.VERSION)) throw new Error('Version must be X.Y.Z');
      - name: Bump version
        run: bump-my-version bump --new-version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: version-bump
          path: |
            build.zig.zon
            .bumpversion.toml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  binaries:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: version-bump
          path: .
      - uses: jdx/mise-action@v4
      - name: Build and archive
        run: zig build archive -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: zig-out/release/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: binaries
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/download-artifact@v8
        with:
          name: version-bump
          path: .
      - uses: jdx/mise-action@v4
      - name: Stage version bump
        run: git add -u
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Validate release packages
        run: |
          zig build packages -- dist
          cp zig-out/packages/SHA256SUMS dist/
      - name: Commit, tag, and push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin main "v$VERSION"
      - name: Create release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create "v$VERSION" dist/* --generate-notes

  publish-packages:
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: hashiiiii
          repositories: Lantana,homebrew-tap,scoop-bucket
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: jdx/mise-action@v4
      - name: Generate package files from release assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release download "v$VERSION" --dir dist
          zig build packages -- dist
      - name: Publish generated package files
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('node:fs/promises');
            for (const [repo, path, source] of [
              ['homebrew-tap', 'Formula/lantana.rb', 'zig-out/packages/lantana.rb'],
              ['scoop-bucket', 'bucket/lantana.json', 'zig-out/packages/lantana.json'],
            ]) {
              const file = { owner: context.repo.owner, repo, path };
              let current;
              try {
                current = (await github.rest.repos.getContent(file)).data;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const content = await fs.readFile(source);
              if (current && content.equals(Buffer.from(current.content, 'base64'))) continue;
              await github.rest.repos.createOrUpdateFileContents({
                ...file,
                message: `chore: lantana v${process.env.VERSION}`,
                content: content.toString('base64'),
                ...(current && { sha: current.sha }),
              });
            }
